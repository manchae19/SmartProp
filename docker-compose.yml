services:
  mysql:
    image: mysql:8.4.9
    environment:
      MYSQL_DATABASE: smartprop
      MYSQL_USER: smartprop
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in root .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in root .env}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - smartprop_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  smartprop_mysql:

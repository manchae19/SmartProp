server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/smartprop?connectionTimeZone=UTC}
    username: ${DB_USER:smartprop}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: false
    locations: classpath:database/migrations
  sql:
    init:
      mode: never
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  jackson:
    deserialization:
      fail-on-unknown-properties: true
management:
  endpoints.web.exposure.include: health
  endpoint.health:
    show-details: never
    probes.enabled: true
    group.readiness.include: readinessState,db
app:
  valuation:
    enabled: false
    base-url: http://127.0.0.1:8000
  refresh:
    enabled: false
    secure-cookie: true
  email:
    enabled: false
    worker-enabled: false
    payload-key: ${MAIL_PAYLOAD_KEY:}
    smtp-host: ${SMTP_HOST:}
    smtp-user: ${SMTP_USER:}
    smtp-password: ${SMTP_PASSWORD:}
    sender: ${MAIL_SENDER:}
    frontend-url: ${MAIL_FRONTEND_URL:http://localhost:5173}
  messaging:
    enabled: false
  projects-management:
    enabled: false
  legal-documents:
    enabled: false
  seed:
    enabled: false
  database-seed:
    enabled: false
  jwt-secret: ${JWT_SECRET}
  token-minutes: 30
  storage-root: ${STORAGE_ROOT:./var/uploads}
  cors-origins: ${CORS_ORIGINS:http://localhost:5173}

# MVC DEBUG can include rejected password values; keep request/response logging at INFO.
logging:
  level:
    org.springframework.web: INFO
